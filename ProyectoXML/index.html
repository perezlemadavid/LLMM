<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quiz XML & AJAX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-app">
        <header>
            <h1 id="ui-title">Cargando...</h1>
            <div class="info-bar">
                <button onclick="changeLanguage('es')">ES</button>
                <button onclick="changeLanguage('en')">EN</button>
                <div id="timer">Tiempo: 0s</div>
            </div>
        </header>

        <div id="quiz-content">
            </div>

        <div class="actions">
            <button id="btn-next" onclick="handleNext()" style="display:none;">Siguiente</button>
            <button id="btn-finish" onclick="showFinalScore()" style="display:none;">Finalizar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
