<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fallout - Contacto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Fallout</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="historia.html">Historia</a></li>
        <li class="nav-item"><a class="nav-link" href="juegos.html">Juegos</a></li>
        <li class="nav-item"><a class="nav-link" href="facciones.html">Facciones</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item">
          <button id="botonMusica" class="btn btn-outline-success ms-3">🔇</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h2>Contacto</h2>

  <form>
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Mensaje</label>
      <textarea class="form-control"></textarea>
    </div>

    <button type="submit" class="btn btn-warning">Enviar</button>
  </form>

  <audio id="musicaFondo" loop>
    <source src="audio/fallout-music.mp3" type="audio/mp3">
  </audio>

  <a href="index.html" class="btn btn-secondary mt-3">Volver al Inicio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const musica = document.getElementById("musicaFondo");
  const boton = document.getElementById("botonMusica");
  boton.addEventListener("click", () => {
    if (musica.paused) {
      musica.play();
      boton.innerHTML = "🔊";
    } else {
      musica.pause();
      boton.innerHTML = "🔇";
    }
  });
});
</script>

</body>
</html>
