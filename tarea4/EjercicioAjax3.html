<!DOCTYPE html>
<html>
<head>
<style>
    table, th, td { border: 1px solid black; border-collapse: collapse; padding: 10px; }
    th { background-color: #f2f2f2; }
</style>
</head>
<body>

<h2>Trabajando con JSON Array</h2>
<p id="longitud"></p>
<div id="tabla-json"></div>

<script>
const xhttp = new XMLHttpRequest();
xhttp.onload = function() {
    // Convertimos el texto recibido en un array de JavaScript
    const miArray = JSON.parse(this.responseText);

    // 1. Muestra la longitud del array
    document.getElementById("longitud").innerHTML = "<b>Longitud del array:</b> " + miArray.length;

    // 2. Muestra los elementos usando una tabla
    let tabla = "<table><tr><th>Índice</th><th>Nombre / Valor</th></tr>";
    
    for (let i = 0; i < miArray.length; i++) {
        tabla += "<tr><td>" + i + "</td><td>" + miArray[i] + "</td></tr>";
    }
    
    tabla += "</table>";
    document.getElementById("tabla-json").innerHTML = tabla;
}
xhttp.open("GET", "json_demo_array.txt");
xhttp.send();
</script>

</body>
</html>
