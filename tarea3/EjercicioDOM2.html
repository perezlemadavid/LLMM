<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2: Formulario</title>
</head>
<body>
    <form id="miFormulario">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="text" id="apellidos" placeholder="Apellidos" required>
        <button type="button" onclick="saludar()">Enviar datos</button>
    </form>
    <p id="mensaje"></p>

    <script>
        function saludar() {
            const nombre = document.forms["miFormulario"]["nombre"].value;
            const apellidos = document.forms["miFormulario"]["apellidos"].value;
            if (nombre && apellidos) {
                document.getElementById("mensaje").innerHTML = `Hola ${nombre} ${apellidos}, gracias por completar el formulario.`;
            }
        }
    </script>
</body>
</html>
