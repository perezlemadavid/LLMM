<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 7: OnClick Imagen</title>
</head>
<body>
    <button onclick="ponerImagen()">Mostrar Imagen</button>
    <div id="zona"></div>

    <script>
        function ponerImagen() {
            const zona = document.getElementById("zona");
            const img = document.createElement("img");
            img.src = "https://picsum.photos/150";
            zona.appendChild(img);
        }
    </script>
</body>
</html>
