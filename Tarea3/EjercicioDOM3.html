<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3: Agregar Imagen</title>
</head>
<body>
    <div id="contenedor"></div>

    <script>
        const div = document.getElementById("contenedor");
        const imagen = document.createElement("img");
        imagen.src = "https://picsum.photos/200";
        div.appendChild(imagen);
    </script>
</body>
</html>
