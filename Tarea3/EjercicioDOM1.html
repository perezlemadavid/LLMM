<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1: Conceptos Básicos DOM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .contenedor-origen {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 20px;
        }
        #resultado {
            background-color: #f9f9f9;
            border: 2px dashed #007bff;
            padding: 15px;
            min-height: 50px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="contenedor-origen">
        <p>Este es el primer párrafo de ejemplo.</p>
        <p>Aquí tenemos un segundo párrafo con más información.</p>
        <p>Y finalmente, el tercer párrafo que será copiado.</p>
    </div>

    <button onclick="mostrarContenido()">Mostrar en el DIV</button>

    <h3>Contenido del DIV de destino:</h3>
    <div id="resultado"></div>

    <script>
        function mostrarContenido() {
            const parrafos = document.getElementsByTagName("p");
            const destino = document.getElementById("resultado");
            
            destino.innerHTML = "";

            for (let i = 0; i < parrafos.length; i++) {
                destino.innerHTML += "<p>" + parrafos[i].innerHTML + "</p>";
            }
        }
    </script>

</body>
</html>
