<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8: Calculadora JS</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        .calculator {
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 0px 0px #22313f;
            width: 300px;
        }

        .screen {
            width: 100%;
            height: 50px;
            background-color: #bdc3c7;
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: right;
            padding: 10px;
            font-size: 1.5rem;
            box-sizing: border-box;
            color: #2c3e50;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn {
            padding: 20px;
            border-radius: 5px;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #ecf0f1;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #d5dbdb;
        }

        .btn-yellow {
            background-color: #f1c40f;
        }

        .btn-grey {
            background-color: #95a5a6;
            color: white;
        }

        .btn-equal {
            grid-column: span 2;
            background-color: #f1c40f;
        }

        .btn-clear {
            grid-column: span 2;
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="screen" id="screen" readonly>
        
        <div class="buttons">
            <button class="btn btn-yellow" data-num="*">*</button>
            <button class="btn btn-yellow" data-num="/">/</button>
            <button class="btn btn-yellow" data-num="-">-</button>
            <button class="btn btn-yellow" data-num="+">+</button>

            <button class="btn" data-num="9">9</button>
            <button class="btn" data-num="8">8</button>
            <button class="btn" data-num="7">7</button>
            <button class="btn" data-num="6">6</button>
            <button class="btn" data-num="5">5</button>
            <button class="btn" data-num="4">4</button>
            <button class="btn" data-num="3">3</button>
            <button class="btn" data-num="2">2</button>
            <button class="btn" data-num="1">1</button>
            <button class="btn" data-num="0">0</button>
            <button class="btn" data-num=".">.</button>

            <button class="btn btn-grey" id="equalBtn">=</button>
            <button class="btn btn-clear" id="clearBtn">C</button>
        </div>
    </div>

    <script>
        const screen = document.getElementById('screen');
        const buttons = document.querySelectorAll('.btn[data-num]');
        const clearBtn = document.getElementById('clearBtn');
        const equalBtn = document.getElementById('equalBtn');

        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                let value = e.target.dataset.num;
                screen.value += value;
            });
        });

        equalBtn.addEventListener('click', () => {
            if (screen.value === '') {
                screen.value = "";
            } else {
                try {
                    let answer = eval(screen.value);
                    screen.value = answer;
                } catch (error) {
                    screen.value = "Error";
                }
            }
        });

        clearBtn.addEventListener('click', () => {
            screen.value = "";
        });
    </script>
</body>
</html>
