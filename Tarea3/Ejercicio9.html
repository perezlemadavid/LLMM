<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 9: Conversor de Temperatura</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
        }
        input {
            margin-bottom: 10px;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Conversor</h2>
        
        <label>Fahrenheit:</label>
        <input type="number" id="tbf">
        
        <label>Celsius:</label>
        <input type="number" id="tbc">
        
        <button type="button" onclick="convertir()">Convertir</button>
        <button type="button" onclick="limpiar()" style="margin-top: 5px; background-color: #6c757d;">Limpiar</button>
    </div>

    <script>
        function convertir() {
            let fahr = document.getElementById("tbf").value;
            let cels = document.getElementById("tbc").value;

            if (fahr !== "") {
                let resultadoC = (fahr - 32) * 5 / 9;
                document.getElementById("tbc").value = resultadoC.toFixed(2);
            } else if (cels !== "") {
                let resultadoF = (cels * 9 / 5) + 32;
                document.getElementById("tbf").value = resultadoF.toFixed(2);
            }
        }

        function limpiar() {
            document.getElementById("tbf").value = "";
            document.getElementById("tbc").value = "";
        }
    </script>

</body>
</html>
