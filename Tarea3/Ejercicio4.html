<!DOCTYPE html>
<html>
<head>
<style>
.navbar {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #333;
}

.navbar li {
    float: left;
}

.navbar li a {
    display: block;
    color: white;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
}

.navbar li a:hover {
    background-color: #555;
    color: white;
}
</style>
</head>
<body>

<ul class="navbar">
  <li><a href="#home">HOME</a></li>
  <li><a href="#news">NEWS</a></li>
  <li><a href="#contact">CONTACT</a></li>
  <li><a href="#about">ABOUT</a></li>
</ul>

<h3>Menú Horizontal Modificado</h3>

<p>Este es el resultado del menú horizontal con efecto hover.</p>

</body>
</html>
