<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Lista anidada (2 niveles)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    ul { margin: 0 0 1em 1.2em; }
  </style>
</head>
<body>

  <h1>Ejemplo: lista anidada de dos niveles</h1>

  <ul>
    <li>Elemento 1</li>
    <li>Elemento 2
      <ul>
        <li>Subelemento 2.1</li>
        <li>Subelemento 2.2</li>
      </ul>
    </li>
    <li>Elemento 3</li>
    <li>Elemento 4
      <ul>
        <li>Subelemento 4.1</li>
        <li>Subelemento 4.2</li>
      </ul>
    </li>
  </ul>

</body>
</html>
