<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 14 - Margin y Padding</title>
  <style>

    h2 {
      font-family: Verdana, sans-serif;
      border: 2px solid black; 
      padding: 5px;
    }

    p {
      font-family: Courier, monospace;
      background-color: #f0f0f0;
    }

    #div1 {
      margin: 0px;
      padding: 50px;
      background-color: #FFCCCC;
    }

    #div2 {
      margin: 30px;
      padding: 0px;
      background-color: #ccffcc;
    }

    #div3 {
      margin: 50px;
      padding: 30px;
      background-color: #CCCCFF;
    }

    #div4 {
      margin: 30px;
      padding: 50px;
      background-color: #FFFFCC;
    }
  </style>
</head>
<body>

  <div id="div1">
    <h2 id="header1">Cabecera 1</h2>
    <p id="para1">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

  <div id="div2">
    <h2 id="header2">Cabecera 2</h2>
    <p id="para2">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

  <div id="div3">
    <h2 id="header3">Cabecera 3</h2>
    <p id="para3">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

  <div id="div4">
    <h2 id="header4">Cabecera 4</h2>
    <p id="para4">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

</body>
</html>
