<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 12 - HTML Styles</title>
  <style>
    h2 {
      font-family: Verdana, sans-serif;
    }

    p {
      font-family: Courier, monospace;
    }

    #div1 {
      background-color: #FFCCCC;
      color: #660000;
      text-align: left;
      padding: 10px;
      margin-bottom: 10px;
    }

    #div2 {
      background-color: #CCFFCC;
      color: #006600;
      text-align: center;
      padding: 10px;
      margin-bottom: 10px;
    }

    #div3 {
      background-color: #CCCCFF;
      color: #000066;
      text-align: right;
      padding: 10px;
      margin-bottom: 10px;
    }

    #div4 {
      background-color: #FFFFCC;
      color: #666600;
      text-align: justify;
      padding: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div id="div1">
    <h2 id="header1">Cabecera 1</h2>
    <p id="para1">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

  <div id="div2">
    <h2 id="header2">Cabecera 2</h2>
    <p id="para2">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

  <div id="div3">
    <h2 id="header3">Cabecera 3</h2>
    <p id="para3">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

  <div id="div4">
    <h2 id="header4">Cabecera 4</h2>
    <p id="para4">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

</body>
</html>
