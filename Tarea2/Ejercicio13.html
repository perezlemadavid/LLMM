<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 13 - HTML Borders</title>
  <style>
    h2 {
      font-family: Verdana, sans-serif;
      padding: 5px;
    }

    p {
      font-family: Courier, monospace;
      padding: 10px;
    }

    #div1 {
      border: 3px solid #FF0000; 
      margin-bottom: 10px;
    }
    #header1 {
      border: 2px solid #FF6600;
    }

    #div2 {
      border: 3px dashed #00FF00; 
      margin-bottom: 10px;
    }
    #header2 {
      border: 2px solid #009900;
    }

    #div3 {
      border: 3px dotted #0000FF; 
      margin-bottom: 10px;
    }
    #header3 {
      border: 2px solid #000066;
    }

    #div4 {
      border: 3px double #FF00FF; 
      margin-bottom: 10px;
    }
    #header4 {
      border: 2px solid #660066;
    }
  </style>
</head>
<body>

  <div id="div1">
    <h2 id="header1">Cabecera 1</h2>
    <p id="para1">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

  <div id="div2">
    <h2 id="header2">Cabecera 2</h2>
    <p id="para2">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

  <div id="div3">
    <h2 id="header3">Cabecera 3</h2>
    <p id="para3">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

  <div id="div4">
    <h2 id="header4">Cabecera 4</h2>
    <p id="para4">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>

</body>
</html>
