<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio 25 - Formularios</title>
</head>
<body>

<h1>Rellena tu CV</h1>

<form action="#" method="post">

  <label>Nombre</label><br>
  <input type="text" name="nombre" maxlength="30"><br><br>

  <label>Apellidos</label><br>
  <input type="text" name="apellidos" maxlength="80"><br><br>

  <label>Contraseña</label><br>
  <input type="password" name="password" maxlength="10"><br><br>

  <label>DNI</label><br>
  <input type="text" name="dni"><br><br>

  <label>Sexo</label><br>
  <input type="radio" name="sexo" value="hombre"> Hombre<br>
  <input type="radio" name="sexo" value="mujer"> Mujer<br><br>

  <label>Incluir mi foto</label><br>
  <input type="file" name="foto"><br><br>

  <input type="checkbox" name="newsletter" checked>
  Suscribirme al boletín de novedades<br><br>

  <fieldset>
    <legend>Datos personales</legend>

    <label>Provincia</label><br>
    <select name="provincia">
      <option>- selecciona -</option>
      <option>Huelva</option>
      <option>Sevilla</option>
      <option>Cádiz</option>
      <option>Córdoba</option>
      <option>Málaga</option>
    </select><br><br>

    <label>Fecha de nacimiento</label><br>
    <input type="text" size="2"> de
    <select>
      <option>Enero</option>
      <option>Febrero</option>
      <option>Marzo</option>
      <option>Abril</option>
      <option>Mayo</option>
      <option>Junio</option>
      <option>Julio</option>
      <option>Agosto</option>
      <option>Septiembre</option>
      <option>Octubre</option>
      <option>Noviembre</option>
      <option>Diciembre</option>
    </select>
    de <input type="text" size="4"><br><br>

    <label>Temas de interés</label><br>
    <select name="temas" multiple size="5">
      <option>Administración de bases de datos</option>
      <option>Análisis y programación</option>
      <option>Arquitectura</option>
      <option>Calidad</option>
      <option>ERP, CRM, Business Intelligence</option>
    </select>

  </fieldset>

  <br>
  <input type="submit" value="Guardar cambios">
  <input type="reset" value="Borrar los datos introducidos">

</form>

</body>
</html>
