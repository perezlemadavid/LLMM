<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 15 - Tabla</title>
  <style>
    table {
      border-collapse: collapse;
      width: 50%;
    }
    th, td {
      border: 1px solid black;
      padding: 5px 10px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    tfoot td {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Su pedido</h2>

  <table>
    <thead>
      <tr>
        <th>Nombre producto</th>
        <th>Precio unitario</th>
        <th>Unidades</th>
        <th>Subtotal</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Reproductor MP3 (80 GB)</td>
        <td>192.02</td>
        <td>1</td>
        <td>192.02</td>
      </tr>
      <tr>
        <td>Fundas de colores</td>
        <td>2.50</td>
        <td>5</td>
        <td>12.50</td>
      </tr>
      <tr>
        <td>Reproductor de radio & control remoto</td>
        <td>12.99</td>
        <td>1</td>
        <td>12.99</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td>TOTAL</td>
        <td>-</td>
        <td>7</td>
        <td>207.51</td>
      </tr>
    </tfoot>
  </table>

</body>
</html>
